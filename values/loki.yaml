deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig: { replication_factor: 1 }
  storage: { type: filesystem }
  schemaConfig:
    configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index: { prefix: index_, period: 24h }
  limits_config:
    retention_period: 72h
singleBinary:
  replicas: 1
  nodeSelector: { kubernetes.io/hostname: srv1 }
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 300Mi }
    limits: { memory: 600Mi }
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
gateway:
  replicas: 1
  nodeSelector: { kubernetes.io/hostname: srv1 }
  resources:
    requests: { memory: 32Mi }
    limits: { memory: 64Mi }
